<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coop Sociétaires</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/scanner-favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/scanner-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <script>
    // Lancée depuis une icône d'écran d'accueil installée sur cette page : démarrer sur le scanner.
    // Le scanner pose un marqueur de session ; s'il est présent, on navigue dans l'app
    // (lien « Cartes membres ») et la page doit s'afficher normalement.
    (function () {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      let inApp = false;
      try { inApp = sessionStorage.getItem('coop.inapp') === '1'; } catch (e) { inApp = true; }
      if (standalone && !inApp) location.replace('./');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="brand">
    <a class="logo-link" href="./" aria-label="Retour au scanner"><img class="logo" src="./icons/logo.jpg" alt="Coopérative de Ménilmontant" width="96" height="96"></a>
    <div>
    <h1>Sociétaires de la Coop</h1>
    <p id="source" class="source">Chargement…</p>
    </div>
  </header>
  <a class="back" href="./">← Retour au scanner</a>
  <main>
    <p class="muted">Scanne le QR de la carte du sociétaire avec l'app, ou touche une carte, pour voir ses contributions.</p>
    <div id="login"></div>
    <input id="search" class="search" type="search" placeholder="Rechercher un nom ou un pseudo…"
      autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Rechercher un sociétaire" hidden>
    <p id="no-result" class="muted" hidden>Aucun sociétaire ne correspond.</p>
    <div id="cards" class="cards"></div>
  </main>

  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./data.js"></script>
  <script>
    (async () => {
      const { configure, loadTransactions, membersFrom } = window.CoopData;
      const src = document.getElementById('source');
      const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      async function render(config) {
        configure(config);
        src.textContent = 'Chargement…';
        const tx = await loadTransactions();
        const members = membersFrom(tx.transactions);
        src.textContent = tx.ok ? `${members.length} sociétaires` : 'Onglet Transactions injoignable : ' + tx.error;
        src.className = 'source ' + (tx.ok ? 'sheet' : 'demo');
        const base = location.origin + location.pathname.replace(/cartes(\.html)?$/, '');
        const cards = document.getElementById('cards');
        cards.innerHTML = members.map(m => {
          const url = `${base}?id=${encodeURIComponent(m.id)}`;
          const qr = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(url)}`;
          const key = norm(`${m.name} ${m.id}`);
          return `<div class="card-item" data-search="${esc(key)}">
            <a class="card" href="./?id=${encodeURIComponent(m.id)}">
              <img class="flower" src="./icons/flower.png" alt="" width="56" height="56">
              <h3>${esc(m.name)}</h3>
              <div class="tier">${esc(m.tier)}</div>
              <img class="qr" src="${qr}" alt="QR ${esc(m.name)}" loading="lazy" width="160" height="160">
              <small>${esc(m.id)}</small>
            </a>
          </div>`;
        }).join('');

        // Recherche : nom ou pseudo, sans tenir compte des accents ni de la casse.
        const search = document.getElementById('search');
        const noResult = document.getElementById('no-result');
        search.hidden = false;
        search.addEventListener('input', () => {
          const q = norm(search.value.trim());
          let shown = 0;
          for (const c of cards.children) {
            const ok = !q || c.dataset.search.includes(q);
            c.hidden = !ok;
            if (ok) shown++;
          }
          noResult.hidden = shown > 0;
        });
      }
      const config = await window.CoopAuth.unlockStored();
      if (config) render(config);
      else { src.textContent = 'Connexion requise'; window.CoopAuth.requireLogin(document.getElementById('login'), render); }
    })();
  </script>
</body>
</html>
